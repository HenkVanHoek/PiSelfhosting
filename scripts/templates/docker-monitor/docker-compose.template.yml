# scripts/templates/docker-monitor/docker-compose.yml.template
services:
  monitor:
    image: nginx:alpine
    container_name: piselfhosting-docker-monitor
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro # HTML content wordt hier gemount
    ports:
      - "8088:80" # Webserver poort voor de monitor pagina
    networks:
      - piselfhosting_net

networks:
  piselfhosting_net:
    external: true

