[bumpversion]
# De versie ZONDER 'v'
current_version = 1.0.0
commit = True
tag = True
# NIEUW: Definieer expliciet hoe de tag-naam eruit moet zien
tag_name = v{new_version}
message = "chore(release): bump version to {new_version}"

# NIEUW: Definieer hoe de versie-string wordt opgebouwd en gelezen
# Dit is nodig voor je 'Alpha' pre-release tag
serialize =
	{major}.{minor}.{patch}-{release}
	{major}.{minor}.{patch}
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(-(?P<release>[a-zA-Z0-9]+))?

[bumpversion:file:VERSION]
# De zoek- en vervangacties werken nu met de schone versie
search = {current_version}
replace = {new_version}

# NIEUW: Definieer 'release' als een officieel onderdeel van de versie
[bumpversion:part:release]
optional_value = prod
values =
	Alpha
	Beta
	prod