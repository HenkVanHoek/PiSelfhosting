name: Build Ubuntu Installer

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller (Linux)
        run: >-
          python -m PyInstaller --noconfirm --onefile
          --name "PiSelfhosting-Installer-Linux"
          --icon="images/piselfhosting-icon192x192.png"
          --add-data "src:src"
          --add-data "templates:templates"
          --add-data "components_list.txt:."
          --add-data "config:config"
          --add-data "config/default_selected_components.txt:selected_components.txt"
          --add-data "Dockerfile.setup-tool:."
          --add-data "favicon.ico:."
          piselfhosting_installer.py

      - name: Create Installation Package
        run: |
          mkdir -p package

          # Kopieer de benodigde bestanden
          cp dist/PiSelfhosting-Installer-Linux package/
          cp install.sh package/
          cp piselfhosting-icon.png package/
          cp piselfhosting-installer.desktop package/
          
          # Create the .tar.gz archive
          tar -czvf PiSelfhosting-Installer-Linux.tar.gz -C package .

      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./PiSelfhosting-Installer-Linux.tar.gz
          asset_name: PiSelfhosting-Installer-Linux.tar.gz
          tag: ${{ github.ref_name }}
          overwrite: true