name: Build Ubuntu Installer

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller (Linux)
        run: >-
          python -m PyInstaller --noconfirm --windowed
          --name "PiSelfhosting-Configurator"
          --add-data "configurator_app/templates:configurator_app/templates"
          --add-data "src:src"
          --add-data "config:config"
          --add-data "templates:templates"
          --add-data "piselfhosting_installer.py:."
          configurator_app/app.py

      - name: Create Installation Package
        run: |
          mkdir -p package
          cp -r dist/PiSelfhosting-Configurator package/
          cp linux/install.sh package/
          cp images/piselfhosting-icon192x192.png package/
          cp linux/piselfhosting-Configurator.desktop package/
          
          # Create the .tar.gz archive with a descriptive name
          tar -czvf PiSelfhosting-Installer-Linux.tar.gz -C package .

      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./PiSelfhosting-Installer-Linux.tar.gz
          asset_name: PiSelfhosting-Installer-Linux.tar.gz
          tag: ${{ github.ref_name }}
          overwrite: true