# .github/workflows/test.yml

name: Run Pytest

# This workflow runs on pushes and pull requests to the 'main' branch.
# It is configured to skip execution if only the README.md file has changed,
# to optimize build times and resource usage.
on:
  push:
    branches: [ main ]
    paths-ignore: # Do NOT run this workflow if ONLY these paths are changed
      - 'README.md'
      - 'docs/**' # Example: if you have a documentation folder
      - '*.md'    # Example: to ignore all Markdown files
  pull_request:
    branches: [ main ]
    paths-ignore: # Do NOT run this workflow if ONLY these paths are changed
      - 'README.md'
      - 'docs/**'
      - '*.md'

jobs:
  test:
    # Run the tests on an Ubuntu virtual machine.
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository's code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install the dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the Pytest suite.
      - name: Run tests with pytest
        run: pytest