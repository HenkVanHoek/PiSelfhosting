name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # Clones the repository to the runner

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Use Python 3.11, consistent with your local setup

    - name: Install dependencies
      # Install dependencies into a virtual environment
      run: |
        python -m pip install --upgrade pip
        python -m venv .venv # Create the virtual environment
        source .venv/bin/activate # Activate the virtual environment
        pip install -r requirements.txt # Install dependencies from requirements.txt

    - name: Run Pytest tests
      # This step executes the tests.
      # The 'working-directory' is already the repository root by default for 'actions/checkout'.
      # We call the wrapper script that internally calls pytest.
      run: |
        source .venv/bin/activate # Re-activate the venv for the current shell session
        python run_pytest_wrapper.py # Execute the wrapper script