# .github/workflows/release.yml

# Name of the workflow, displayed on the GitHub Actions tab.
name: Release Pipeline

# This workflow is triggered on two events:
# 1. When a new tag starting with 'v' (e.g., v1.0, v1.2.3) is pushed.
# 2. Manually, via the 'Run workflow' button on the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # This job builds the executables for each operating system.
  build-executables:
    name: Build for ${{ matrix.os-name }}
    runs-on: ${{ matrix.os-runner }}
    strategy:
      matrix:
        include:
          - os-name: Linux
            os-runner: ubuntu-latest
            artifact-name: PiSelfhosting-Linux
          - os-name: macOS
            os-runner: macos-latest
            artifact-name: PiSelfhosting-macOS
          - os-name: Windows
            os-runner: windows-latest
            artifact-name: PiSelfhosting-Windows.exe

    steps:
    # Step 1: Checks out the repository's code.
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Sets up the specified Python version.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 3: Install critical system-level dependencies.
    - name: Install system dependencies (Linux)
      if: matrix.os-name == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y nmap sshpass

    - name: Install system dependencies (macOS)
      if: matrix.os-name == 'macOS'
      run: brew install nmap sshpass

    - name: Install system dependencies (Windows)
      if: matrix.os-name == 'Windows'
      run: choco install nmap
      # Note: sshpass is not readily available on Windows via package managers.
      # The application will handle this gracefully.

    # Step 4: Install Python packages from pyproject.toml.
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,test]
        pip install pyinstaller

    # Step 5: Run Pytest to ensure the code is valid before building.
    - name: Run tests with Pytest
      run: pytest

    # Step 6: Build the executable using the .spec file.
    - name: Build the executable with PyInstaller
      run: |
        rm -rf build dist
        pyinstaller PiSelfhostingInstaller.spec

    # Step 7: Package the built executable for uploading.
    - name: Package the executable
      shell: bash
      run: |
        mkdir -p artifact
        mv dist/PiSelfhostingInstaller* "artifact/${{ matrix.artifact-name }}"

    # Step 8: Upload the packaged executable as a build artifact.
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer-${{ matrix.os-name }}
        path: artifact/

  # This job creates the final GitHub Release after all builds are successful.
  release:
    name: Create GitHub Release
    needs: build-executables
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Download all artifacts from the build jobs.
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true

      # Step 2: Create a separate .zip archive for each installer.
      - name: Zip installers for release
        run: |
          zip -j PiSelfhosting-Windows.zip installers/PiSelfhosting-Windows.exe
          zip -j PiSelfhosting-macOS.zip installers/PiSelfhosting-macOS
          zip -j PiSelfhosting-Linux.zip installers/PiSelfhosting-Linux

      # Step 3: Creates or updates a GitHub Release and attaches the assets.
      - name: Upload assets to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: "PiSelfhosting-*.zip"
          file_glob: true
          overwrite: true