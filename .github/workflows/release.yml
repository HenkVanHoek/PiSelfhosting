# .github/workflows/release.yml
name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-executables:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'requirements-dev.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install pyinstaller

    - name: Build the executable with PyInstaller
      shell: bash
      run: |
        # Set OS-specific variables for the build command
        if [ "$RUNNER_OS" == "Windows" ]; then
          SEP=";"
          ICON_ARG="--icon=images/favicon.ico"
        else
          SEP=":"
          # You can add --icon for macOS (.icns) or Linux (.png) here later
          ICON_ARG=""
        fi

        # Build the executable with all necessary paths and data files
        # Best practice: ensure the build environment is completely clean
        rm -rf build dist

        pyinstaller --name "PiSelfhosting-Configurator-${{ matrix.os }}" \
          --onefile \
          --windowed \
          --paths src \
          --add-data "piselfhosting_installer.py${SEP}." \
          --add-data "configurator_app/templates${SEP}templates" \
          --add-data "config${SEP}config" \
          --add-data "templates${SEP}templates" \
          $ICON_ARG \
          configurator_app/app.py

    - name: Package the executable
      shell: bash
      run: |
        # Create a directory for the artifact
        mkdir -p artifact

        # Move the executable into the directory
        if [ "$RUNNER_OS" == "Windows" ]; then
          mv dist/PiSelfhosting-Configurator-windows-latest.exe artifact/PiSelfhosting-Configurator.exe
        elif [ "$RUNNER_OS" == "macOS" ]; then
          mv dist/PiSelfhosting-Configurator-macos-latest artifact/PiSelfhosting-Configurator
        else
          mv dist/PiSelfhosting-Configurator-ubuntu-latest artifact/PiSelfhosting-Configurator
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer-${{ matrix.os }}
        path: artifact/

  release:
    name: Create GitHub Release
    # This job will only run after all build jobs have successfully completed
    needs: build-executables
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create/update a release

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          # The pattern matches the artifact names from the build job
          pattern: installer-*
          merge-multiple: true

      - name: Zip installers for release
        run: |
          # Create zip files for each platform's installer
          zip -j PiSelfhosting-Installer-Windows.zip installers/PiSelfhosting-Configurator.exe
          zip -j PiSelfhosting-Installer-macOS.zip installers/PiSelfhosting-Configurator
          zip -j PiSelfhosting-Installer-Linux.zip installers/PiSelfhosting-Configurator

      - name: Upload assets to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # Attach to the release corresponding to the git tag
          tag: ${{ github.ref_name }}
          # Upload all zip files created in the previous step
          file: "PiSelfhosting-Installer-*"
          file_glob: true
          overwrite: true
