# .github/workflows/build.yml

name: Build Cross-Platform Installers

# This workflow runs when a new release is published
on:
  release:
    types: [published]

jobs:
  build:
    # Define the matrix to build on all 3 major operating systems
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    # Run the job on the OS specified in the matrix
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Ensure all dependencies from your project are listed in requirements.txt
          pip install -r requirements.txt

      - name: Set executable name based on OS
        id: set-names
        # PowerShell (pwsh) is used because it's available on all three runners
        shell: pwsh
        run: |
          $ext = ""
          if ('${{ runner.os }}' -eq 'Windows') {
            $ext = ".exe"
          }
          $asset_name = "PiSelfhosting-Installer-${{ runner.os }}$ext"
          echo "ASSET_NAME=$asset_name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set platform-specific path separator
        id: set-separator
        shell: pwsh
        run: |
          if ('${{ runner.os }}' -eq 'Windows') {
            # Windows uses a semicolon (;) as the path separator for --add-data
            echo "SEP=;" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            # macOS and Linux use a colon (:)
            echo "SEP=:" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build executable with PyInstaller
        run: >-
          pyinstaller --onefile
          --name "${{ env.ASSET_NAME }}"
          --add-data "src${{ env.SEP }}src"
          --add-data "templates${{ env.SEP }}templates"
          --add-data "components_list.txt${{ env.SEP }}."
          --add-data "components_metadata.json${{ env.SEP }}."
          --add-data "selected_components.txt${{ env.SEP }}."
          --add-data "Dockerfile.setup-tool${{ env.SEP }}."
          piselfhosting_installer.py

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/${{ env.ASSET_NAME }}
          asset_name: ${{ env.ASSET_NAME }}
          asset_content_type: application/octet-stream