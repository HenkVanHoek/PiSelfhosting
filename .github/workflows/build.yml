# .github/workflows/build.yml

name: Build Cross-Platform Installers

# The workflow starts when a new release is published
on:
  release:
    types: [published]

jobs:
  build:
    # Define the matrix to build on all 3 operating systems
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    # Run the job on the OS from the matrix
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Make sure all your dependencies are in requirements.txt
          pip install -r requirements.txt

      - name: Set executable name based on OS
        id: set-names
        # PowerShell (pwsh) works on all 3 operating systems
        shell: pwsh
        run: |
          $ext = ""
          if ('${{ runner.os }}' -eq 'Windows') {
            $ext = ".exe"
          }
          $asset_name = "PiSelfhosting-Installer-${{ runner.os }}$ext"
          echo "ASSET_NAME=$asset_name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build with PyInstaller
        run: >-
          pyinstaller --onefile
          --name "${{ env.ASSET_NAME }}"
          --add-data "src;src"
          --add-data "templates;templates"
          --add-data "components_list.txt;."
          --add-data "components_metadata.json;."
          --add-data "selected_components.txt;."
          --add-data "Dockerfile.setup-tool;."
          piselfhosting_installer.py

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/${{ env.ASSET_NAME }}
          asset_name: ${{ env.ASSET_NAME }}
          asset_content_type: application/octet-stream # A more generic type