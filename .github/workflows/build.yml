# .github/workflows/build.yml

name: Build Cross-Platform Installers

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Set executable name based on OS
        id: set-names
        shell: pwsh
        run: |
          $ext = ""
          if ('${{ runner.os }}' -eq 'Windows') {
            $ext = ".exe"
          }
          $asset_name = "PiSelfhosting-Installer-${{ runner.os }}$ext"
          echo "ASSET_NAME=$asset_name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # This step runs ONLY on Windows and sets the separator to a semicolon
      - name: Set path separator for Windows
        if: runner.os == 'Windows'
        run: echo "SEP=;" >> $env:GITHUB_ENV
        shell: pwsh

      # This step runs on any OS that is NOT Windows (i.e., Linux and macOS)
      # and sets the separator to a colon
      - name: Set path separator for Linux and macOS
        if: runner.os != 'Windows'
        run: echo "SEP=:" >> $GITHUB_ENV
        shell: bash

      # The rest of the workflow uses the correctly set SEP variable
      - name: Build executable with PyInstaller
        run: >-
          pyinstaller --onefile
          --name "${{ env.ASSET_NAME }}"
          --add-data "src${{ env.SEP }}src"
          --add-data "templates${{ env.SEP }}templates"
          --add-data "components_list.txt${{ env.SEP }}."
          --add-data "components_metadata.json${{ env.SEP }}."
          --add-data "selected_components.txt${{ env.SEP }}."
          --add-data "Dockerfile.setup-tool${{ env.SEP }}."
          piselfhosting_installer.py

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/${{ env.ASSET_NAME }}
          asset_name: ${{ env.ASSET_NAME }}
          asset_content_type: application/octet-stream