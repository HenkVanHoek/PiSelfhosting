name: Build macOS Installer

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller create-dmg
          pip install -r requirements.txt

      - name: Build with PyInstaller (macOS)
        run: >-
          python -m PyInstaller --noconfirm --windowed
          --name "PiSelfhosting-Configurator"
          --icon="images/piselfhosting-apple.icns"
          --add-data "configurator_app/templates:configurator_app/templates"
          --add-data "src:src"
          --add-data "config:config"
          --add-data "templates:templates"
          --add-data "piselfhosting_installer.py:."
          configurator_app/app.py

      - name: Create DMG Image
        run: |
          create-dmg \
            --volname "PiSelfhosting Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "PiSelfhosting-Configurator.app" 200 190 \
            --hide-extension "PiSelfhosting-Configurator.app" \
            --app-drop-link 600 185 \
            "PiSelfhosting-Installer-macOS.dmg" \
            "dist/PiSelfhosting-Configurator.app"

      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./PiSelfhosting-Installer-macOS.dmg
          asset_name: PiSelfhosting-Installer-macOS.dmg
          tag: ${{ github.ref_name }}
          overwrite: true