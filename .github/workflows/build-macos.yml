name: Build macOS Installer

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build with PyInstaller (macOS)
        run: >-
          python -m PyInstaller --noconfirm --windowed \
            --name "PiSelfhosting-Configurator" \
            --icon="path/to/your/apple-icon.icns" \
            --add-data "configurator_app/templates:configurator_app/templates" \
            --add-data "src:src" \
            --add-data "config:config" \
            --add-data "templates:templates" \
            --add-data "piselfhosting_installer.py:." \
            configurator_app/app.py

      - name: Create DMG
        run: |
          create-dmg \
            --volname "PiSelfhosting Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "dist/PiSelfhosting-Installer.dmg" \
            "dist/PiSelfhosting-Installer.app"

      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/PiSelfhosting-Installer.dmg
          asset_name: PiSelfhosting-Installer-macOS.dmg
          tag: ${{ github.ref_name }}
          overwrite: true