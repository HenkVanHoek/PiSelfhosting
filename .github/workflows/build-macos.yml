name: Build macOS Installer

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller (macOS)
        run: >-
          python -m PyInstaller --onefile
          --name "PiSelfhosting-Installer-macOS"
          --add-data "src:src"
          --add-data "templates:templates"
          --add-data "components_list.txt:."
          --add-data "components_metadata.json:."
          --add-data "selected_components.txt:."
          --add-data "Dockerfile.setup-tool:."
          piselfhosting_installer.py

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/PiSelfhosting-Installer-macOS
          asset_name: PiSelfhosting-Installer-macOS
          asset_content_type: application/octet-stream