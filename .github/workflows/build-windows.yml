name: Build Windows Installer

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller (Windows)
        run: |
          python -m PyInstaller --noconfirm --onefile  --windowed `
            --name "PiSelfhosting-Configurator" `
            --icon="images/favicon.ico" `
            --add-data "configurator_app/templates;configurator_app/templates" `
            --add-data "src;src" `
            --add-data "config;config" `
            --add-data "templates;templates" `
            --add-data "piselfhosting_installer.py;." `
            configurator_app/app.py

      - name: Create Installation Package
        run: |
          mkdir package
          cp dist/PiSelfhosting-Configurator.exe package/
          
          # Use powershell to create the zip archive
          powershell -Command "Compress-Archive -Path .\\package\\* -DestinationPath .\\PiSelfhosting-Installer-Windows.zip"

      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./PiSelfhosting-Installer-Windows.zip
          asset_name: PiSelfhosting-Installer-Windows.zip
          tag: ${{ github.ref_name }}
          overwrite: true