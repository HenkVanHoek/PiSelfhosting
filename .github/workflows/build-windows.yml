name: Build Windows Installer

on:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller (Windows)
        run: >-
          python -m PyInstaller --noconfirm --windowed \
           --name "PiSelfhosting-Configurator" \
           --icon="path/to/your/icon.ico" \
           --add-data "configurator_app/templates:configurator_app/templates" \
           --add-data "src:src" \
           --add-data "config:config" \
           --add-data "templates:templates" \
           --add-data "piselfhosting_installer.py:." \
           configurator_app/app.py

      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/PiSelfhosting-Installer-Windows.exe
          asset_name: PiSelfhosting-Installer-Windows.exe
          tag: ${{ github.ref_name }}
          overwrite: true