# pyproject.toml (Final, Complete Version)

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line_length = 88

[tool.pytest.ini_options]
pythonpath = [
  "."
]
norecursedirs = ["scripts", "test_scanner.py"]

[project]
name = "PiSelfhosting"
version = "0.4.46-Alpha"
description = "A project to self-host services on a Raspberry Pi."
requires-python = ">=3.11"

# THIS NEW SECTION IS THE PRIMARY FIX
# It lists all packages required for the application to run.
dependencies = [
    "flask",
    "python-dotenv",
    "python-nmap",
    "psutil",
    "PyYAML",
    "ansible-runner",
    "jinja2",
    "platformdirs",
    "requests",
    "keyring",
    "appdirs",
    "paramiko"
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*egg-info*"]

[project.optional-dependencies]
test = [
    "pytest",
]
dev = [
    "bump-my-version",
    "pre-commit",
    "black",
    "isort",
    "flake8",
    "pyinstaller",
]

[tool.bump-my-version]
current_version = "0.4.46-Alpha"
commit = true
tag = true
commit_args = "--no-verify"
message = "chore(release): bump version to {new_version}"
tag_name = "v{new_version}"

[[tool.bump-my-version.files]]
path = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bump-my-version.files]]
path = "README.md"
search = "label=release-v{current_version}"
replace = "label=release-v{new_version}"

[[tool.bump-my-version.parts.release]]
values = ["Alpha", "Beta", "prod"]
optional_value = "prod"

[[tool.mypy.overrides]]
module = [
    "utils.resource_utils",
    "managers.ssh_manager",
    "onvif.*",
    "appdirs",
    "managers.component_manager",
    "managers.deployment_manager",
    "managers.setup_manager",
    "pi_scanner",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
