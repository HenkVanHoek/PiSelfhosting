[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line_length = 88

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
norecursedirs = ["scripts"]

[project]
name = "PiSelfhosting"
description = "A project to self-host services on a Raspberry Pi."
requires-python = ">=3.11"
dynamic = ["version"]

[tool.setuptools]
package_dir = {"" = "src"}

[tool.setuptools.packages.find]
# Automatically find all packages (folders with __init__.py) in src
where = ["src"]
exclude = ["*egg-info*"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[project.optional-dependencies]
test = [
    "pytest",
]
