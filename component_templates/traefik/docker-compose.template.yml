# templates/traefik/docker-compose.template.yml
services:
  traefik:
    image: traefik:v3.0 # Use a specific Traefik v3 version
    container_name: piselfhosting-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      # Entrypoints for HTTP (web) and HTTPS (websecure)
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.traefik.address=:8080 # Traefik Dashboard/API port (internal)

      # Enable Docker provider for service discovery
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false # Only expose services with traefik.enable=true label

      # Enable API and Dashboard (access via :8080 or dedicated domain via NPM/Traefik rule)
      - --api.dashboard=true
      - --api.insecure=false # Set to true for local development only, otherwise access via router

      # Enable ACME (Let's Encrypt) for automatic SSL certificate generation
      - "--certificatesresolvers.letsencrypt.acme.email={{ ADMIN_EMAIL | default('admin@yourdomain.com') }}" # Your email for Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json" # Path to store certs
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web" # For HTTP-01 challenge

      # Log settings (optional)
      - --log.level=INFO # DEBUG, INFO, WARN, ERROR
      - --accesslog=true # Enable access logs

    ports:
      - "80:80"   # The HTTP port Traefik listens on
      - "443:443" # The HTTPS port Traefik listens on
      # - "8080:8080" # Only expose Traefik dashboard if needed directly, generally proxy via NPM/Traefik rule

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Mount Docker socket for Traefik to discover services
      - "{{DATA_ROOT}}/traefik/config:/etc/traefik" # Mount configuration directory for Traefik
      - "{{DATA_ROOT}}/traefik/acme:/letsencrypt" # Mount directory for Let's Encrypt certificates
    networks:
      - piselfhosting_net

# Define global volumes needed by Traefik
volumes:
  traefik_config:
    name: piselfhosting-traefik-config # Optional: if you need a specific named volume
  traefik_acme:
    name: piselfhosting-traefik-acme # Optional: for ACME cert storage

networks:
  piselfhosting_net:
    external: true
