services:
  traefik-init:
    image: busybox:1.36
    container_name: piselfhosting-traefik-init
    restart: "no"
    volumes:
      - "{{ TRAEFIK_ACME_STORAGE_PATH }}:/etc/traefik/acme.json"
    command:
      - "sh"
      - "-c"
      - "touch /etc/traefik/acme.json && chmod 600 /etc/traefik/acme.json"

  traefik:
    image: traefik:{{ component_version }}
    container_name: piselfhosting-traefik
    restart: unless-stopped
    depends_on:
      traefik-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

    command:
      - "--api.dashboard=true"
      - "--log.level={{ TRAEFIK_LOG_LEVEL }}"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.dashboard.address=:8080"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email={{ TRAEFIK_ADMIN_EMAIL }}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

    ports:
      - "80:80"
      - "443:443"
      # --- DEFINITIVE FIX: Remove redundant default; rely on the context ---
      - "{{ TRAEFIK_WEB_PORT }}:8080"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "{{ TRAEFIK_ACME_STORAGE_PATH }}:/etc/traefik/acme.json"
      - "{{ TRAEFIK_CONFIG_PATH }}:/etc/traefik/dynamic/"

    networks:
      - piselfhosting_net

    labels:
      - "traefik.enable=true"
      # START OF FIX: Add basic auth middleware definition
      - "traefik.http.middlewares.traefik-auth.basicauth.users={{ TRAEFIK_DASHBOARD_USERS }}"
      # END OF FIX: Add basic auth middleware definition
      - "traefik.http.routers.traefik-dashboard-direct.entrypoints=dashboard"
      - "traefik.http.routers.traefik-dashboard-direct.service=api@internal"
      - "traefik.http.routers.traefik-dashboard-direct.rule=PathPrefix(`/`)"
      # START OF FIX: Apply middleware to direct router
      - "traefik.http.routers.traefik-dashboard-direct.middlewares=traefik-auth"
      # END OF FIX: Apply middleware to direct router
      - "traefik.http.routers.traefik-dashboard-secure.rule=Host(`{{ DOMAIN_NAME }}`)"
      - "traefik.http.routers.traefik-dashboard-secure.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard-secure.service=api@internal"
      - "traefik.http.routers.traefik-dashboard-secure.tls.certresolver=letsencrypt"
      # START OF FIX: Apply middleware to secure router
      - "traefik.http.routers.traefik-dashboard-secure.middlewares=traefik-auth"
      # END OF FIX: Apply middleware to secure router
      - "traefik.http.routers.traefik-dashboard-http.rule=Host(`{{ DOMAIN_NAME }}`)"
      - "traefik.http.routers.traefik-dashboard-http.entrypoints=web"

networks:
  piselfhosting_net:
    external: true
