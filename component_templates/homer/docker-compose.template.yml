services:
  homer:
    container_name: piselfhosting-homer
    image: bcpierce/homer:latest
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - "{{DATA_ROOT}}/homer/assets:/www/assets"
    # Homer is simple and does not need PUID/PGID/TZ
    extra_hosts:
      - "{{DOMAIN}}:{{ HOST_IP | default('127.0.0.1') }}"
    networks:
      - piselfhosting_net

networks:
  piselfhosting_net:
    external: true
