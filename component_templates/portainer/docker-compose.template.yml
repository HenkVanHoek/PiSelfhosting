# templates/portainer/docker-compose.template.yml
services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: piselfhosting-portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000" # Portainer web UI
    networks:
      - piselfhosting_net

volumes:
  portainer_data:
    name: piselfhosting-portainer-data

networks:
  piselfhosting_net:
    external: true
