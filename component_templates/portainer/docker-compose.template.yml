services:
  portainer:
    image: portainer/portainer-ce:{{ PORTAINER_IMAGE_TAG | default('latest') }}
    container_name: piselfhosting-portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "{{ PORTAINER_HTTP_PORT | default('9000') }}:9000"
    networks:
      - piselfhosting_net

volumes:
  portainer_data:
    name: piselfhosting-portainer-data

networks:
  piselfhosting_net:
    external: true
