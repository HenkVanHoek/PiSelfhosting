services:
  dashy:
    container_name: piselfhosting-dashy
    image: lissy93/dashy:{{ DASHY_IMAGE_TAG | default('latest') }}
    restart: unless-stopped
    ports:
      - "{{ DASHY_HTTP_PORT | default('8080') }}:80"
      - "{{ DASHY_HTTPS_PORT | default('4443') }}:443"
    volumes:
      - "{{ PISelfhosting_DATA_PATH }}/dashy:/app/user-data"
    environment:
      - "PUID={{ PUID | default('1000') }}"
      - "PGID={{ PUID | default('1000') }}" # PGID uses the same as PUID
      - "TZ={{ TZ | default('Europe/Amsterdam') }}"
      - NODE_ENV=production
    extra_hosts:
      - "{{ DOMAIN | default('home.arpa') }}:{{ PISelfhosting_HOST_IP | default('127.0.0.1') }}"
    networks:
      - piselfhosting_net
networks:
  piselfhosting_net:
    external: true