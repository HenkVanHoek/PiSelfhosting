<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiSelfhosting Configurator</title>

    <!-- Favicon links -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/piselfhosting-icon192x192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/piselfhosting-icon192x192.png') }}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Link to our local, fetched stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='piselfhosting-style.css') }}">

    <!-- Google Fonts: Montserrat and Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Font Awesome (Classic CDN Method) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/piselfhosting-icon192x192.png') }}" alt="PiSelfhosting Logo" style="height: 120px;">
                    <h1 class="h2 mt-3">PiSelfhosting Configurator</h1>
                </div>

                <!-- This card is our main "wizard" container. Its content will be replaced by JavaScript. -->
                <div class="card shadow-sm" id="wizard-card">
                    <div class="card-header text-center bg-light" id="wizard-header">
                        <strong>Step 1 of 3: Find Your Devices</strong>
                    </div>
                    <div class="card-body p-4 p-md-5 text-center" id="wizard-body">

                        <h2 class="h4">Scan Your Network</h2>
                        <p class="text-muted">
                            PiSelfhosting will scan your local network to find any available Raspberry Pi devices.
                        </p>

                        <div class="d-grid gap-2 col-8 mx-auto my-4">
                            <button id="begin-scan-btn" class="btn btn-primary btn-lg">
                                <i class="fa-solid fa-magnifying-glass me-2"></i>
                                Begin Scan
                            </button>
                        </div>

                        <a class="small" data-bs-toggle="collapse" href="#advancedScanOptions" role="button" aria-expanded="false" aria-controls="advancedScanOptions">
                            Need to scan a different network? <strong>Show Advanced Options</strong>
                        </a>

                        <div class="collapse mt-4" id="advancedScanOptions">
                            <div class="card card-body bg-light text-start">
                                <h3 class="h6 mb-3">Advanced Scan Options</h3>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="scanType" id="autoDetectRadio" value="auto" checked>
                                    <label class="form-check-label" for="autoDetectRadio">
                                        Auto-detect my local subnet (Recommended)
                                    </label>
                                </div>
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="radio" name="scanType" id="manualScanRadio" value="manual">
                                    <label class="form-check-label" for="manualScanRadio">
                                        Manually specify a subnet or IP range:
                                    </label>
                                </div>
                                <input type="text" class="form-control form-control-sm mt-2" id="manualSubnetInput" placeholder="e.g., 192.168.1.0/24" disabled>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-light" id="wizard-footer" style="min-height: 50px; display: flex; align-items: center; justify-content: center;">
                        <p class="text-muted small mb-0">Waiting to start...</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Application-specific JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Get references to the main wizard sections
            const wizardHeader = document.getElementById('wizard-header');
            const wizardBody = document.getElementById('wizard-body');
            const wizardFooter = document.getElementById('wizard-footer');

            // --- Function to Render Step 2 ---
            const renderStep2_ConfigureDevices = (scanData) => {
                // Update header and footer
                wizardHeader.innerHTML = '<strong>Step 2 of 3: Configure Your Devices</strong>';
                wizardFooter.innerHTML = '<p class="text-muted small mb-0">Enter the SSH credentials for the devices you want to manage.</p>';

                // Build the new HTML for the card body
                let newBodyHTML = `
                    <div class="text-start">
                        <h2 class="h4 text-center">
                            Device Configuration
                            <!-- NEW: Help icon with a popover -->
                            <i class="fa-solid fa-circle-question text-muted ms-2" style="font-size: 0.8em; cursor: pointer;"
                               data-bs-toggle="popover"
                               data-bs-trigger="hover focus"
                               data-bs-title="How Detection Works"
                               data-bs-content="The scanner looks for two types of devices: 1. Physical Raspberry Pis by checking for a hardware model file. 2. PiSelfhosting Virtual Pis by checking for the '/etc/piselfhosting-virtual-pi-server' file inside the guest OS."></i>
                        </h2>
                        <p class="text-muted text-center small mb-4">
                            Found ${scanData.hosts.length} potential Pi network interfaces.
                            Provide credentials for each device to get more details.
                        </p>

                        <!-- Master Credentials Form -->
                        <div class="card card-body bg-light mb-4">
                            <h3 class="h6">Common Actions</h3>
                            <p class="small text-muted">Use these fields to apply credentials to all devices, or to clear all selections.</p>
                            <div class="row g-2">
                                <div class="col-sm-4">
                                    <input type="text" class="form-control form-control-sm" id="master-username" placeholder="Username">
                                </div>
                                <div class="col-sm-4">
                                    <input type="password" class="form-control form-control-sm" id="master-password" placeholder="Password">
                                </div>
                                <div class="col-sm-2 d-grid">
                                    <button class="btn btn-secondary btn-sm" id="apply-to-all-btn">Apply</button>
                                </div>
                                <!-- NEW: Deselect All button -->
                                <div class="col-sm-2 d-grid">
                                    <button class="btn btn-outline-secondary btn-sm" id="deselect-all-btn">Clear All</button>
                                </div>
                            </div>
                        </div>

                        <!-- Container for the device cards -->
                        <div id="device-cards-container"></div>

                        <!-- Final Action Buttons -->
                        <div class="d-grid gap-2 col-8 mx-auto my-4">
                            <button id="get-details-btn" class="btn btn-primary btn-lg">
                                <i class="fa-solid fa-plug-circle-check me-2"></i>
                                Connect & Get Details
                            </button>
                        </div>
                    </div>
                `;
                wizardBody.innerHTML = newBodyHTML;

                // Now, dynamically create and insert a card for each device
                const container = document.getElementById('device-cards-container');
                scanData.hosts.forEach((host, index) => {
                    const cardHTML = `
                        <div class="card mt-3 device-card" data-ip="${host.ip}">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h5 class="card-title mb-0"><i class="fa-solid fa-server me-2"></i>${host.hostname || 'Unknown Host'}</h5>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" role="switch" id="manageDeviceSwitch-${index}" checked>
                                        <label class="form-check-label" for="manageDeviceSwitch-${index}">Manage</label>
                                    </div>
                                </div>
                                <p class="card-text text-muted small">IP: ${host.ip} | MAC: ${host.mac}</p>
                                <div class="row g-2">
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control form-control-sm device-username" placeholder="Username">
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="password" class="form-control form-control-sm device-password" placeholder="Password">
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer text-body-secondary small">
                                Status: <span class="status-text">Pending credentials...</span>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });

                // --- Add Event Listeners for the new Step 2 elements ---
                const applyBtn = document.getElementById('apply-to-all-btn');
                const masterUser = document.getElementById('master-username');
                const masterPass = document.getElementById('master-password');
                const deselectBtn = document.getElementById('deselect-all-btn');

                applyBtn.addEventListener('click', () => {
                    const allUserInputs = document.querySelectorAll('.device-username');
                    const allPassInputs = document.querySelectorAll('.device-password');
                    allUserInputs.forEach(input => input.value = masterUser.value);
                    allPassInputs.forEach(input => input.value = masterPass.value);
                });

                // NEW: Event listener for the "Deselect All" button
                deselectBtn.addEventListener('click', () => {
                    const allManageSwitches = document.querySelectorAll('.device-card .form-check-input');
                    allManageSwitches.forEach(s => s.checked = false);
                });

                // NEW: Initialize Bootstrap Popovers
                const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
                const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl));

                // Add event listener for the "Connect & Get Details" button
                const getDetailsBtn = document.getElementById('get-details-btn');
                getDetailsBtn.addEventListener('click', handleGetDeviceDetails);
            };

            const handleGetDeviceDetails = async () => {
                const getDetailsBtn = document.getElementById('get-details-btn');
                getDetailsBtn.disabled = true;
                getDetailsBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i>Connecting...`;

                const deviceCards = document.querySelectorAll('.device-card');
                const promises = [];

                deviceCards.forEach(card => {
                    const isManaged = card.querySelector('[type="checkbox"]').checked;
                    if (!isManaged) {
                        return;
                    }

                    const ip = card.dataset.ip;
                    const username = card.querySelector('.device-username').value;
                    const password = card.querySelector('.device-password').value;
                    const statusEl = card.querySelector('.status-text');

                    statusEl.className = 'status-text text-primary';
                    statusEl.textContent = 'Connecting...';

                    const promise = fetch('/get-device-details', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ip, username, password })
                    })
                    .then(async response => {
                        const data = await response.json();
                        if (!response.ok) {
                            throw new Error(data.error || `HTTP error! Status: ${response.status}`);
                        }
                        return data;
                    })
                    .then(data => {
                        statusEl.className = 'status-text text-success fw-bold';
                        const model = data.details.model || 'Unknown Model';
                        statusEl.textContent = `Success! (Model: ${model})`;
                    })
                    .catch(error => {
                        console.error(`Error for IP ${ip}:`, error);
                        statusEl.className = 'status-text text-danger';
                        statusEl.textContent = `Failed: ${error.message}`;
                    });

                    promises.push(promise);
                });

                await Promise.allSettled(promises);

                getDetailsBtn.disabled = false;
                getDetailsBtn.innerHTML = `<i class="fa-solid fa-plug-circle-check me-2"></i>Connect & Get Details`;
            };

            // --- Initial Setup for Step 1 ---
            const setupStep1 = () => {
                const scanBtn = document.getElementById('begin-scan-btn');
                const autoRadio = document.getElementById('autoDetectRadio');
                const manualRadio = document.getElementById('manualScanRadio');
                const manualInput = document.getElementById('manualSubnetInput');

                autoRadio.addEventListener('change', () => { manualInput.disabled = autoRadio.checked; });
                manualRadio.addEventListener('change', () => {
                    if (manualRadio.checked) {
                        manualInput.disabled = false;
                        manualInput.focus();
                    }
                });

                const performScan = async () => {
                    scanBtn.disabled = true;
                    wizardFooter.innerHTML = `<p class="text-primary small mb-0"><i class="fa-solid fa-spinner fa-spin me-2"></i>Scanning network...</p>`;

                    let subnetToScan = manualRadio.checked ? manualInput.value : null;

                    try {
                        const response = await fetch('/scan-pis', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ subnet: subnetToScan })
                        });

                        if (!response.ok) throw new Error(`Server responded with status: ${response.status}`);

                        const data = await response.json();
                        console.log("Scan successful. Data from server:", data);

                        if (data.permissions_error) {
                            wizardFooter.innerHTML = `<div class="text-start text-warning small p-2">...</div>`; // Abridged for brevity
                        } else {
                            renderStep2_ConfigureDevices(data);
                        }
                    } catch (error) {
                        console.error('An error occurred during the scan:', error);
                        wizardFooter.innerHTML = `<p class="text-danger small mb-0"><i class="fa-solid fa-xmark me-2"></i>An error occurred. Check console.</p>`;
                    } finally {
                        // scanBtn.disabled = false;
                    }
                };

                scanBtn.addEventListener('click', performScan);
            };

            setupStep1();
        });
    </script>
</body>
</html>
