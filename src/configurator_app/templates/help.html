<!-- src/configurator_app/templates/help.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiSelfhosting Help &amp; Documentation</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/piselfhosting-style.css') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="{{ url_for('static', filename='images/piselfhosting-icon192x192.png') }}"
                 alt="PiSelfhosting Logo"
                 width="32"
                 height="32"
                 class="d-inline-block align-text-top me-3 rounded">
            PiSelfhosting Documentation
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-arrow-left me-1"></i> Back to Wizard</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4" style="max-width: 1400px;">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0"><i class="fa-solid fa-book me-2"></i> Topics</h5>
                </div>
                <div class="list-group list-group-flush" id="doc-tabs" role="tablist">
                    {% for doc_name in docs.keys() %}
                    <button class="list-group-item list-group-item-action {% if loop.first %}active{% endif %}"
                            id="tab-{{ loop.index }}"
                            data-bs-toggle="list"
                            data-bs-target="#panel-{{ loop.index }}"
                            type="button"
                            role="tab">
                        <i class="fa-solid fa-file-lines me-2"></i> {{ doc_name }}
                    </button>
                    {% endfor %}
                </div>
            </div>
        </div>

        <!-- Documentation Content -->
        <div class="col-md-9">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="tab-content" id="nav-tabContent">
                        {% for doc_name, content in docs.items() %}
                        <div class="tab-pane fade {% if loop.first %}show active{% endif %}"
                             id="panel-{{ loop.index }}"
                             role="tabpanel"
                             aria-labelledby="tab-{{ loop.index }}">
                            <div class="markdown-body" id="rendered-content-{{ loop.index }}"></div>
                            <script id="markdown-raw-{{ loop.index }}" type="text/markdown">{{ content|safe }}</script>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Configure marked options
        marked.setOptions({
            gfm: true,
            breaks: true
        });

        // Render each markdown tab
        {% for doc_name in docs.keys() %}
        (function() {
            const raw = document.getElementById("markdown-raw-{{ loop.index }}").textContent;
            document.getElementById("rendered-content-{{ loop.index }}").innerHTML = marked.parse(raw);
        })();
        {% endfor %}
    });
</script>
</body>
</html>
