<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiSelfhosting Component Editor</title>
    <link rel="icon" href="{{ url_for('editor.static', filename='images/favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('editor.static', filename='images/piselfhosting-icon192x192.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/solarized.min.css">
    <style>
        body, html { height: 100%; overflow: hidden; }
        .main-container { display: flex; height: 100vh; padding-top: 56px; }
        .sidebar { background-color: #f8f9fa; border-right: 1px solid #dee2e6; padding: 1rem; overflow-y: auto; width: 280px; min-width: 200px; max-width: 600px; }
        .content { flex-grow: 1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; }
        /* noinspection CssUnusedSymbol */
        #feedback-alert { position: fixed; top: 20px; right: 20px; z-index: 1050; }
        #editor-wrapper { border: 1px solid #dee2e6; border-radius: 0.25rem; flex-grow: 1; position: relative; }
        /* noinspection CssUnusedSymbol */
        #editor-wrapper.drag-over { border: 2px dashed #0d6efd; background-color: rgba(13, 110, 253, 0.05); }
        .resizer { flex-shrink: 0; width: 5px; background-color: #f1f1f1; cursor: col-resize; border-right: 1px solid #dee2e6; }
        .resizer:hover { background-color: #0d6efd; }
        /* noinspection CssUnusedSymbol */
        .group-header-exclusive { background-color: #fdf8e3; border-left: 4px solid #f0ad4e; }
        /* noinspection CssUnusedSymbol */
        .group-header { cursor: grab; }
        /* noinspection CssUnusedSymbol */
        .group-header:active { cursor: grabbing; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="https://piselfhosting.com" target="_blank">
            <img src="{{ url_for('editor.static', filename='images/piselfhosting-icon192x192.png') }}" alt="PiSelfhosting Logo" width="30" height="30" class="me-2">
            PiSelfhosting Component Editor
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" id="help-link"><i class="bi bi-question-circle"></i> Help</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://github.com/HenkVanHoek/PiSelfhosting" target="_blank"><i class="bi bi-github"></i> GitHub</a>
                </li>
                 <li class="nav-item">
                    <a class="nav-link" href="https://github.com/HenkVanHoek/PiSelfhosting/releases" target="_blank"><i class="bi bi-tag"></i> Releases</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-container">
    <div class="sidebar" id="sidebar">
        <h4>Components</h4>
        <hr>
        <div class="d-grid gap-2 mb-3">
            <button class="btn btn-primary" id="create-new-btn">Create New Component</button>
        </div>
        <div class="list-group" id="component-list"></div>
    </div>

    <div class="resizer" id="drag-handle"></div>

    <div class="content" id="editor-pane">
        <div class="text-center text-muted h-100 d-flex flex-column justify-content-center align-items-center" id="placeholder-text">
            <h4>Welcome to the Component Editor</h4>
            <p class="lead">Select a component from the list to begin editing its metadata, variables, and template.</p>
        </div>

        <div id="editor-content" class="d-none h-100 d-flex flex-column">
            <div class="d-flex justify-content-between align-items-center">
                <h3 id="editor-title"></h3>
                <div class="d-flex align-items-center">
                    <label for="theme-selector" class="form-label me-2 mb-0">Template Editor Theme:</label>
                    <select class="form-select form-select-sm" id="theme-selector" style="width: auto;">
                        <option value="material-darker">Material Darker</option>
                        <option value="monokai">Monokai</option>
                        <option value="dracula">Dracula</option>
                        <option value="solarized light">Solarized Light</option>
                    </select>
                    <button class="btn btn-primary ms-3" id="save-changes-btn">Save All Changes</button>
                </div>
            </div>
            <hr>
            <ul class="nav nav-tabs" id="editorTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#metadata-pane" type="button">Core Metadata</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#variables-pane" type="button">User Variables</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#template-pane" type="button">Docker Compose Template Editor</button>
                </li>
            </ul>
            <div class="tab-content pt-3 d-flex flex-column flex-grow-1" id="editorTabsContent">
                <div class="tab-pane fade show active" id="metadata-pane"></div>
                <div class="tab-pane fade" id="variables-pane"></div>
                <div class="tab-pane fade d-flex flex-column flex-grow-1" id="template-pane">
                    <div class="d-flex justify-content-end mb-2">
                        <button class="btn btn-sm btn-outline-secondary" id="import-template-btn">
                            <i class="bi bi-upload"></i> Import from File
                        </button>
                        <input type="file" id="template-file-input" accept=".yml,.yaml,.txt" style="display: none;">
                    </div>
                    <div id="editor-wrapper">
                        <label for="template-editor" class="visually-hidden">Docker Compose Template Editor</label>
                        <textarea id="template-editor"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<script src="{{ url_for('static', filename='editor.js') }}" defer></script>

</body>
</html>
