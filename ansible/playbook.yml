---
- name: Deploy PiSelfhosting Services
  hosts: all
  become: true
  vars:
    # This is the destination path on the Pi for all configuration
    project_config_dir: "/opt/piselfhosting"

  tasks:
    - name: Ensure project directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      loop:
        - "{{ project_config_dir }}"
        - "{{ project_config_dir }}/docker-compose-fragments"

    - name: Template and copy docker-compose fragments for each service
      ansible.builtin.template:
        src: "../component_templates/{{ item.id }}/docker-compose.yml"
        dest: "{{ project_config_dir }}/docker-compose-fragments/{{ item.id }}.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      loop: "{{ selected_components }}"
      vars:
        # This makes the version available inside the template file
        component_version: "{{ item.version }}"

    - name: Assemble the final docker-compose.yml from fragments
      ansible.builtin.assemble:
        src: "{{ project_config_dir }}/docker-compose-fragments/"
        dest: "{{ project_config_dir }}/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
        # This adds a header to the generated file for clarity
        header: |
          # This file is auto-generated by the PiSelfhosting tool.
          # Do not edit this file directly.

    - name: Deploy services with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ project_config_dir }}"
        state: present
        pull: always # Ensures the correct image version is used