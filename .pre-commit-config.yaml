# .pre-commit-config.yaml

# Exclude directories containing old scripts or generated files.
# The regex matches any path starting with 'scripts_oud/' OR 'docker/'.
exclude: '(^scripts_oud/|^docker/)'

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-json
    -   id: check-merge-conflict

# Add the 'black' auto-formatter. It will run first.
-   repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
    -   id: black

# Add the 'isort' import sorter. It will run after black.
-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
    -   id: isort
        name: isort (python)

# Finally, run 'flake8' to catch any remaining issues.
-   repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
    -   id: flake8
