services:
  organizr:
    container_name: piselfhosting-organizr
    image: lscr.io/linuxserver/organizr:latest
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - "{{DATA_ROOT}}/organizr/config:/config"
    environment:
      - "PUID={{PUID}}"
      - "PGID={{PGID}}"
      - "TZ={{TZ}}"
    extra_hosts:
      - "{{DOMAIN}}:{{ HOST_IP | default('127.0.0.1') }}"
    networks:
      - piselfhosting_net

networks:
  piselfhosting_net:
    external: true
