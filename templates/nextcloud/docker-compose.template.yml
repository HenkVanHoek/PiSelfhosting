services:
  nextcloud:
    image: nextcloud:stable
    container_name: piselfhosting-nextcloud
    restart: unless-stopped
    ports:
      - "4430:80"
    volumes:
      - "{{DATA_ROOT}}/nextcloud/html:/var/www/html"
    environment:
      # Secrets now use Docker's native substitution
      - "MYSQL_HOST=mariadb"
      - "MYSQL_DATABASE=piselfhosting"
      - "MYSQL_USER=${DB_USER}"
      - "MYSQL_PASSWORD=${DB_PASS}"
      - "NEXTCLOUD_ADMIN_USER=${NC_ADMIN_USER}"
      - "NEXTCLOUD_ADMIN_PASSWORD=${NC_ADMIN_PASS}"
    depends_on:
      - mariadb
    extra_hosts:
      - "{{DOMAIN}}:{{ HOST_IP | default('127.0.0.1') }}"
    networks:
      - piselfhosting_net

networks:
  piselfhosting_net:
    external: true
